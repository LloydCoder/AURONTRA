# ═══════════════════════════════════════════════════════════════════
# ResilientAI Nginx location block
# Drop this into your existing /etc/nginx/sites-available/tinlance
# server block, alongside the existing ThreatFade/FusionOps blocks
# ═══════════════════════════════════════════════════════════════════

# ResilientAI API — port 8003
location /resilientai/ {
    proxy_pass http://127.0.0.1:8003/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;

    # CORS headers for dashboard
    add_header Access-Control-Allow-Origin "https://resilientai.tinlance.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;

    if ($request_method = OPTIONS) {
        return 204;
    }
}

# ResilientAI WebSocket (for live agent feed)
location /resilientai/ws/ {
    proxy_pass http://127.0.0.1:8003/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
}
