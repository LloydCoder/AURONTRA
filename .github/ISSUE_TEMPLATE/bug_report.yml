name: Bug report
description: Report a reproducible defect in Aurontra.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md for private disclosure.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect?
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Include the commit SHA or release tag.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, database, and relevant deployment mode.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe reproduction.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs and output
      description: Remove tokens, keys, customer data, and sensitive telemetry before posting.
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Related issues, screenshots, or diagnostic details.
    validations:
      required: false
