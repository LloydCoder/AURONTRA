name: Feature request
description: Propose a scoped improvement to Aurontra.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended users
      description: What problem exists, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable behaviors and tests that would demonstrate completion.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and tenant-isolation impact
      description: Consider authentication, authorization, sensitive data, external calls, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Other approaches considered and why this one is preferred.
    validations:
      required: false
