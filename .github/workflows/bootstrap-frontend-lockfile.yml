name: Bootstrap reviewed frontend lockfile
on:
  push:
    branches: [maintenance/frontend-lockfile-bootstrap]
    paths:
      - ".github/workflows/bootstrap-frontend-lockfile.yml"
      - "frontend/package.json"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: frontend-lockfile-bootstrap
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: maintenance/frontend-lockfile-bootstrap
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Generate lockfile from pinned manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean lockfile install
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run lint
          npx tsc --noEmit
          NEXT_TELEMETRY_DISABLED=1 npm run build
      - name: Commit lockfile and open review
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: maintenance/frontend-lockfile-bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
            exit 0
          fi
          git commit -m "build(frontend): add reproducible npm lockfile"
          git push origin HEAD:"$BRANCH"
          gh pr create             --base main             --head "$BRANCH"             --title "build(frontend): commit reproducible npm lockfile"             --body "## Summary\n- Commit the reviewed npm lockfile for the pinned frontend manifest.\n- Verify a clean `npm ci`, dependency audit, lint, typecheck, and production build before merge.\n\nThis PR is generated by a branch-restricted bootstrap workflow; it does not deploy the application."
