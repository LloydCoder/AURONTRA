name: Aurontra Secret and Archive Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan working tree, Git history, and nested archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks binary and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "$url" -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: Scan current files and nested archives
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --max-archive-depth=3 --timeout=300 .

      - name: Scan all reachable Git history and nested archives
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --max-archive-depth=3 --timeout=300 --log-opts="--all" .
