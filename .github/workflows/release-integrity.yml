name: Aurontra SBOM and Build Provenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurontra-release-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attest:
    name: Generate SBOM and attest source snapshot
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Create deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix="aurontra-${GITHUB_SHA}/" "${GITHUB_SHA}" | gzip -n > dist/aurontra-source.tar.gz
          cd dist
          sha256sum aurontra-source.tar.gz > SHA256SUMS
          cd ..

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: dist/aurontra.spdx.json
          artifact-name: aurontra-spdx-sbom
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/aurontra-source.tar.gz

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/aurontra.spdx.json

      - name: Upload source, SBOM, and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: aurontra-release-evidence-${{ github.sha }}
          path: |
            dist/aurontra-source.tar.gz
            dist/aurontra.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
