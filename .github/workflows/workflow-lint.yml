name: Aurontra Workflow Lint

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  actionlint:
    name: Validate GitHub Actions workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: reviewdog/action-actionlint@a5524e1c19e62881d79c1f1b9b6f09f16356e281
        with:
          reporter: github-check
          level: error
          fail_level: error
