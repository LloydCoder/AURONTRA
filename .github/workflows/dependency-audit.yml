name: Aurontra Python Dependency Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit resolved Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install application dependencies
        working-directory: backend
        run: |
          python -m pip install --retries 2 --timeout 30 -r requirements.txt
          python -m pip check

      - name: Install pinned pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit installed dependency environment
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/pip-audit.json"
          set +e
          pip-audit --local --format=json --output "$report"
          audit_status=$?
          set -e
          if [[ -s "$report" ]]; then
            python - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          for dependency in report.get("dependencies", []):
              for vulnerability in dependency.get("vulns", []):
                  print("VULNERABILITY package={name} version={version} id={id} fix_versions={fix}".format(
                      name=dependency.get("name", "unknown"),
                      version=dependency.get("version", "unknown"),
                      id=vulnerability.get("id", "unknown"),
                      fix=",".join(vulnerability.get("fix_versions", [])) or "none-listed",
                  ))
          PY
          fi
          exit "$audit_status"

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: aurontra-pip-audit
          path: \${{ runner.temp }}/pip-audit.json
          if-no-files-found: ignore
          retention-days: 14
