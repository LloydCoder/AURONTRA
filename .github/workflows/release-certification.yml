name: Aurontra Production Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "release/**"
      - "scripts/release_readiness.py"
      - "backend/core/config.py"
      - "backend/alembic/versions/**"
      - ".github/workflows/release-certification.yml"
  push:
    branches: [main]
    paths:
      - "release/**"
      - "scripts/release_readiness.py"
      - "backend/core/config.py"
      - "backend/alembic/versions/**"
      - ".github/workflows/release-certification.yml"
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail unless every production acceptance gate has verified evidence"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  release-readiness:
    name: Validate production acceptance manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Report current blockers without misrepresenting readiness
        if: github.event_name != 'workflow_dispatch' || inputs.strict != true
        run: python scripts/release_readiness.py
      - name: Enforce strict production go/no-go
        if: github.event_name == 'workflow_dispatch' && inputs.strict == true
        run: python scripts/release_readiness.py --strict
