name: Aurontra CI and Deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurontra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests and static sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate dependency environment
        run: python -m pip check

      - name: Compile backend
        run: python -m compileall -q .

      - name: Run full test suite with coverage
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: backend/htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  deployment-preflight:
    name: Deployment configuration preflight
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      deployment_ready: ${{ steps.check.outputs.deployment_ready }}
    env:
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_SSH_HOST_FINGERPRINT: ${{ secrets.EC2_SSH_HOST_FINGERPRINT }}
      EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
      EC2_SERVICE_NAME: ${{ vars.EC2_SERVICE_NAME }}
    steps:
      - name: Validate required deployment configuration without exposing secrets
        id: check
        shell: bash
        run: |
          missing=()
          [[ -n "${EC2_SSH_KEY}" ]] || missing+=("secret EC2_SSH_KEY")
          [[ -n "${EC2_HOST}" ]] || missing+=("variable EC2_HOST")
          [[ -n "${EC2_SSH_HOST_FINGERPRINT}" ]] || missing+=("secret EC2_SSH_HOST_FINGERPRINT")
          [[ -n "${EC2_APP_DIR}" ]] || missing+=("variable EC2_APP_DIR")
          [[ -n "${EC2_SERVICE_NAME}" ]] || missing+=("variable EC2_SERVICE_NAME")

          if (( ${#missing[@]} == 0 )); then
            echo "deployment_ready=true" >> "$GITHUB_OUTPUT"
            echo "All required deployment configuration is present." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deployment_ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deployment not attempted"
              echo ""
              echo "Missing required configuration:"
              for item in "${missing[@]}"; do echo "- $item"; done
              echo ""
              echo "Configure these repository/environment values, then rerun the deployment workflow."
              echo "A skipped deployment is not a successful production deployment."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Deployment skipped because required host, credential, fingerprint, or service configuration is missing."
          fi

  deploy:
    name: Deploy to configured EC2 host
    needs: [test, deployment-preflight]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test.result == 'success' && needs.deployment-preflight.outputs.deployment_ready == 'true'
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_HOST_FINGERPRINT }}
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ vars.EC2_APP_DIR }}"
            SERVICE_NAME="${{ vars.EC2_SERVICE_NAME }}"

            test -d "$APP_DIR/.git"
            test -x "$APP_DIR/.venv/bin/python"
            cd "$APP_DIR"
            git fetch origin main
            git checkout --detach origin/main
            "$APP_DIR/.venv/bin/python" -m pip install -r backend/requirements.txt
            sudo systemctl restart "$SERVICE_NAME"
            sleep 4
            STATUS=$(curl --fail --silent --show-error http://127.0.0.1:8003/health/ |
              python3 -c "import json,sys; print(json.load(sys.stdin).get('status','fail'))")
            test "$STATUS" = "ok"
            echo "Aurontra service health check passed."

      - name: Record deployment evidence
        if: success()
        run: |
          {
            echo "## Deployment verification"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Service health check: passed"
            echo "- This verifies the configured host health endpoint only; it is not a substitute for end-to-end production verification."
          } >> "$GITHUB_STEP_SUMMARY"
