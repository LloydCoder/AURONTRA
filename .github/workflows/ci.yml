name: Aurontra CI and Deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurontra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests and static sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate dependency environment
        run: python -m pip check

      - name: Compile backend
        run: python -m compileall -q .

      - name: Run full test suite with coverage
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: backend/htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  deployment-preflight:
    name: Deployment credential preflight
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      ssh_key_available: ${{ steps.check.outputs.ssh_key_available }}
    env:
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Check required deployment credential without exposing it
        id: check
        shell: bash
        run: |
          if [[ -n "${EC2_SSH_KEY}" ]]; then
            echo "ssh_key_available=true" >> "$GITHUB_OUTPUT"
            echo "Deployment credential is configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ssh_key_available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deployment not attempted"
              echo ""
              echo "The required EC2_SSH_KEY GitHub Actions secret is missing or empty."
              echo "Configure the credential in repository/environment settings, then rerun the deployment workflow."
              echo "This workflow run does not constitute a successful production deployment."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::EC2_SSH_KEY is missing; deployment will be skipped rather than falsely reported as successful."
          fi

  deploy:
    name: Deploy to EC2 Stockholm
    needs: [test, deployment-preflight]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test.result == 'success' && needs.deployment-preflight.outputs.ssh_key_available == 'true'
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_HOST_FINGERPRINT }}
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/opt/tinlance/aurontra"
            SERVICE_NAME="aurontra"

            test -d "$APP_DIR/.git"
            cd "$APP_DIR"
            git fetch origin main
            git checkout --detach origin/main
            "$APP_DIR/.venv/bin/python" -m pip install -r backend/requirements.txt
            sudo systemctl restart "$SERVICE_NAME"
            sleep 4
            STATUS=$(curl --fail --silent --show-error http://127.0.0.1:8003/health/ |
              python3 -c "import json,sys; print(json.load(sys.stdin).get('status','fail'))")
            test "$STATUS" = "ok"
            echo "Aurontra service health check passed."

      - name: Record deployment evidence
        if: success()
        run: |
          {
            echo "## Deployment verification"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Service health check: passed"
            echo "- This verifies the configured host health endpoint only; it is not a substitute for end-to-end production verification."
          } >> "$GITHUB_STEP_SUMMARY"
