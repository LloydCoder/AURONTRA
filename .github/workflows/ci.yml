name: ResilientAI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Test ────────────────────────────────────────────────────────────
  test:
    name: "Test Suite (236 tests)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

      - name: Enforce coverage threshold
        run: pytest tests/ --cov=. --cov-fail-under=60 -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/

  # ── Deploy to EC2 Stockholm (main only) ─────────────────────────────
  deploy:
    name: "Deploy → EC2 Stockholm :8003"
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.50.16.19
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script: |
            set -e
            APP_DIR="/opt/tinlance/resilientai"

            echo "→ Pulling latest code..."
            cd $APP_DIR && git pull origin main

            echo "→ Installing dependencies..."
            $APP_DIR/.venv/bin/pip install -r backend/requirements.txt -q

            echo "→ Restarting service..."
            sudo systemctl restart resilientai

            echo "→ Waiting for startup..."
            sleep 4

            echo "→ Health check..."
            STATUS=$(curl -sf http://localhost:8003/health/ \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','fail'))" \
              2>/dev/null || echo "fail")

            if [ "$STATUS" = "ok" ]; then
              echo "✅ ResilientAI deployed and healthy on :8003"
            else
              echo "❌ Health check failed — status: $STATUS"
              sudo journalctl -u resilientai -n 30 --no-pager
              exit 1
            fi

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ ResilientAI v${{ github.sha }} deployed to 13.50.16.19:8003"
          echo "   Health: http://13.50.16.19/resilientai/health/"
          echo "   Docs:   http://13.50.16.19/resilientai/docs"
