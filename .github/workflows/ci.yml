name: Aurontra CI and Deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurontra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests and static sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate dependency environment
        run: python -m pip check

      - name: Validate Alembic migration on a clean SQLite database
        env:
          DATABASE_URL: sqlite+aiosqlite:///./migration_test.db
        run: |
          alembic upgrade head
          alembic current

      - name: Compile backend
        run: python -m compileall -q .

      - name: Run full test suite with coverage
        env:
          # Explicit test-only opt-out; production defaults remain auth-required and data-plane-closed.
          AUTH_MODE: disabled
          DATA_PLANE_ENABLED: "true"
          TEST_MODE: "true"
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-report
          path: backend/htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  tenant-rls:
    name: PostgreSQL tenant isolation and RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurontra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aurontra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aurontra_test
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/aurontra_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate dependency environment
        run: python -m pip check
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Verify row-level tenant isolation with a non-owner role
        run: pytest tests/integration/test_tenant_rls.py -v --tb=short

  deploy:
    name: Deploy to configured EC2 host
    needs: [test, tenant-rls]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test.result == 'success'
    environment: production
    env:
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_SSH_HOST_FINGERPRINT: ${{ secrets.EC2_SSH_HOST_FINGERPRINT }}
      EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
      EC2_SERVICE_NAME: ${{ vars.EC2_SERVICE_NAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate deployment configuration without exposing secrets
        id: preflight
        shell: bash
        run: |
          missing=()
          [[ -n "${EC2_SSH_KEY}" ]] || missing+=("secret EC2_SSH_KEY")
          [[ -n "${EC2_HOST}" ]] || missing+=("variable EC2_HOST")
          [[ -n "${EC2_SSH_HOST_FINGERPRINT}" ]] || missing+=("secret EC2_SSH_HOST_FINGERPRINT")
          [[ -n "${EC2_APP_DIR}" ]] || missing+=("variable EC2_APP_DIR")
          [[ -n "${EC2_SERVICE_NAME}" ]] || missing+=("variable EC2_SERVICE_NAME")
          if (( ${#missing[@]} == 0 )); then
            echo "deployment_ready=true" >> "$GITHUB_OUTPUT"
            echo "All required deployment configuration is present." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deployment_ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deployment not attempted"
              echo ""
              echo "Missing required configuration:"
              for item in "${missing[@]}"; do echo "- $item"; done
              echo ""
              echo "A skipped deployment is not a successful production deployment."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Deployment refused because required configuration is missing."
            exit 1
          fi

      - name: Deploy via SSH
        if: steps.preflight.outputs.deployment_ready == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_HOST_FINGERPRINT }}
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ vars.EC2_APP_DIR }}"
            SERVICE_NAME="${{ vars.EC2_SERVICE_NAME }}"

            test -d "$APP_DIR/.git"
            test -x "$APP_DIR/.venv/bin/python"
            cd "$APP_DIR"
            REMOTE_URL="$(git remote get-url origin | sed -E 's/\.git$//; s#/$##')"
            case "$REMOTE_URL" in
              https://github.com/LloydCoder/AURONTRA|git@github.com:LloydCoder/AURONTRA|ssh://git@github.com/LloydCoder/AURONTRA) ;;
              *) echo "Refusing deployment: origin is not the canonical Aurontra repository."; echo "Observed remote: $REMOTE_URL"; exit 1 ;;
            esac
            git fetch origin main
            git checkout --detach origin/main
            "$APP_DIR/.venv/bin/python" -m pip install -r backend/requirements.txt
            sudo systemctl restart "$SERVICE_NAME"
            sleep 4
            STATUS=$(curl --fail --silent --show-error http://127.0.0.1:8003/health/live |
              python3 -c "import json,sys; print(str(json.load(sys.stdin).get('alive',False)).lower())")
            test "$STATUS" = "true"
            echo "Aurontra service health check passed."

      - name: Record deployment evidence
        if: steps.preflight.outputs.deployment_ready == 'true' && success()
        run: |
          {
            echo "## Deployment verification"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Service health check: passed"
            echo "- This verifies the configured host health endpoint only; it is not a substitute for end-to-end production verification."
          } >> "$GITHUB_STEP_SUMMARY"
